# Local development database only. Never use these credentials anywhere real.
services:
  db:
    image: postgres:16-alpine
    container_name: glowlogic-db
    environment:
      POSTGRES_USER: glowlogic
      POSTGRES_PASSWORD: glowlogic_dev_only
      POSTGRES_DB: glowlogic
    ports:
      - "127.0.0.1:5433:5432"   # host port 5433 avoids clashing with any Postgres you installed yourself
    volumes:
      - glowlogic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowlogic -d glowlogic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  glowlogic_pgdata:
